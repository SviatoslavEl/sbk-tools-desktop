name: Publish verified desktop release

on:
  workflow_run:
    workflows: ["Release desktop builds"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh run download "$RUN_ID" --repo SviatoslavEl/sbk-tools-desktop --name SBK-Tools-aarch64-apple-darwin-App --dir release-artifacts
          gh run download "$RUN_ID" --repo SviatoslavEl/sbk-tools-desktop --name SBK-Tools-Windows-x64-Portable --dir release-artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mac="$(find release-artifacts -maxdepth 1 -type f -name "SBK-Tools-${RELEASE_TAG}-aarch64-apple-darwin*.app.zip" -print -quit)"
          windows="release-artifacts/ScanDocument.exe"
          test -n "$mac"
          test -f "$mac"
          test -f "$mac.sha256"
          test -f "$windows"
          test -f "$windows.sha256"
          if [[ "$mac" == *-unsigned.app.zip ]]; then
            mac_note='macOS-архив подписан ad-hoc, поскольку в репозитории не настроен сертификат Apple Developer ID. Если Gatekeeper блокирует первый запуск, распакуйте приложение в «Программы» и выполните: `xattr -dr com.apple.quarantine "/Applications/СБК Инструменты.app"`'
          else
            mac_note='macOS-архив подписан сертификатом Apple Developer ID, прошёл нотариальную проверку Apple и готов к обычному запуску.'
          fi
          cat > release-notes.md <<EOF
          Версия $version для Windows x64 и macOS Apple Silicon.

          В сканере маркер, штрих и оба вида размытия перенесены в компактную панель над документом. Добавленные эффекты собраны в отдельном раскрывающемся списке с регулировкой прозрачности и силы; устаревшее безвозвратное скрытие убрано. При объединении PDF и DOCX теперь можно свободно смешивать и переставлять отдельные страницы разных файлов.

          Исправлена совместная работа двух одновременно запущенных версий: каждая копия использует собственную временную область, а закрытие одной не удаляет файлы другой. Проверка блокировки редактора больше не освобождает её во время сохранения. Просмотр документов продолжает работать и для общей папки, доступной только для чтения.

          В реестре договоров стадии, оплата и акты получили самостоятельные цветовые схемы. Возвращены справочные настройки конфиденциальности отдельных реквизитов, добавлены структурированные поля контактного лица и безопасное массовое архивирование только отмеченных договоров с подтверждением.

          В справочнике контрагентов добавлен явный переключатель внешних и внутренних компаний; в кадрах основания сотрудничества различаются цветом. В архиве появились чекбоксы для группового восстановления и удаления. Главное окно удерживается в границах экрана, а длинные списки прокручиваются внутри рабочей области.

          Пароль рабочей папки теперь проверяется до отправки: интерфейс явно сообщает допустимую длину от 6 до 128 символов и причину отказа. Формат базы остаётся обратно совместимым: существующие поля не переименовываются и не удаляются, новые контактные реквизиты добавлены как необязательные.

          Финальные пакеты проверены на чистых GitHub Actions-агентах. Windows: запущен итоговый единый EXE, проверены окно приложения, встроенный сканер и восстановление после аварийного завершения. macOS: из итогового APP обработаны PDF, DOCX, OCR и факсимиле.

          $mac_note
          EOF
          gh release view "$RELEASE_TAG" --repo SviatoslavEl/sbk-tools-desktop >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --repo SviatoslavEl/sbk-tools-desktop --draft --title "СБК Инструменты $RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" "$windows" "$windows.sha256" "$mac" "$mac.sha256" --repo SviatoslavEl/sbk-tools-desktop --clobber
          gh release edit "$RELEASE_TAG" --repo SviatoslavEl/sbk-tools-desktop --title "СБК Инструменты $RELEASE_TAG" --notes-file release-notes.md --draft=false

      - name: Verify published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$RELEASE_TAG" --repo SviatoslavEl/sbk-tools-desktop --json assets,isDraft,url)"
          test "$(jq -r '.isDraft' <<<"$assets")" = false
          jq -e '.assets | map(.name) | index("ScanDocument.exe")' <<<"$assets" >/dev/null
          jq -e '.assets | map(.name) | index("ScanDocument.exe.sha256")' <<<"$assets" >/dev/null
          jq -e --arg tag "$RELEASE_TAG" '.assets | map(.name) | any(. == ("SBK-Tools-" + $tag + "-aarch64-apple-darwin.app.zip") or . == ("SBK-Tools-" + $tag + "-aarch64-apple-darwin-unsigned.app.zip"))' <<<"$assets" >/dev/null
