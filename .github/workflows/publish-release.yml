name: Publish verified desktop release
on:
  workflow_run:
    workflows: ["Release desktop builds"]
    types: [completed]
permissions:
  actions: read
  contents: write
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified macOS and Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          gh run download "$RUN_ID" --repo SviatoslavEl/sbk-tools-desktop --name SBK-Tools-aarch64-apple-darwin-App --dir release-artifacts
          gh run download "$RUN_ID" --repo SviatoslavEl/sbk-tools-desktop --name SBK-Tools-Windows-x64-Installed --dir release-artifacts
      - name: Publish only macOS and Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          repo=SviatoslavEl/sbk-tools-desktop
          version="${RELEASE_TAG#v}"
          mac="$(find release-artifacts -maxdepth 1 -type f -name "SBK-Tools-${RELEASE_TAG}-aarch64-apple-darwin*.app.zip" -print -quit)"
          installer="release-artifacts/SBK-Tools-Fast-Setup-${version}-x64.exe"
          test -n "$mac"
          test -f "$mac"
          test -f "$mac.sha256"
          test -f "$installer"
          test -f "$installer.sha256"
          if gh api "repos/$repo/contents/docs/releases/${RELEASE_TAG}.md?ref=${RELEASE_TAG}" --jq .content > version-notes.base64; then
            base64 --decode version-notes.base64 > release-notes.md
          else
            printf 'СБК Инструменты %s для Windows x64 и macOS Apple Silicon.\n' "$version" > release-notes.md
          fi
          sed -i '/^Состав:/c\Состав: установщик Windows с быстрым запуском и архив приложения macOS. Portable-версия больше не выпускается.' release-notes.md
          if [[ "$mac" == *-unsigned.app.zip ]]; then
            printf '\nmacOS: подпись ad-hoc, без Apple Developer ID и нотариальной проверки Apple. Gatekeeper может ограничить первый запуск.\n' >> release-notes.md
          else
            printf '\nmacOS: подпись Apple Developer ID и нотариальная проверка Apple.\n' >> release-notes.md
          fi
          gh release view "$RELEASE_TAG" --repo "$repo" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --repo "$repo" --draft --title "СБК Инструменты $RELEASE_TAG" --notes-file release-notes.md
          names="$(gh release view "$RELEASE_TAG" --repo "$repo" --json assets --jq '.assets[].name')"
          for obsolete in ScanDocument.exe ScanDocument.exe.sha256; do
            if grep -Fxq "$obsolete" <<<"$names"; then
              gh release delete-asset "$RELEASE_TAG" "$obsolete" --repo "$repo" --yes
            fi
          done
          gh release upload "$RELEASE_TAG" "$installer" "$installer.sha256" "$mac" "$mac.sha256" --repo "$repo" --clobber
          gh release edit "$RELEASE_TAG" --repo "$repo" --title "СБК Инструменты $RELEASE_TAG" --notes-file release-notes.md --draft=false
          assets="$(gh release view "$RELEASE_TAG" --repo "$repo" --json assets,isDraft,url)"
          jq -e '.isDraft == false' <<<"$assets" >/dev/null
          jq -e --arg v "$version" '.assets | map(.name) | index("SBK-Tools-Fast-Setup-" + $v + "-x64.exe")' <<<"$assets" >/dev/null
          jq -e --arg v "$version" '.assets | map(.name) | index("SBK-Tools-Fast-Setup-" + $v + "-x64.exe.sha256")' <<<"$assets" >/dev/null
          jq -e --arg mac "$(basename "$mac")" '.assets | map(.name) | index($mac)' <<<"$assets" >/dev/null
          jq -e --arg mac "$(basename "$mac").sha256" '.assets | map(.name) | index($mac)' <<<"$assets" >/dev/null
          jq -e '.assets | map(.name) | all(. != "ScanDocument.exe" and . != "ScanDocument.exe.sha256")' <<<"$assets" >/dev/null
