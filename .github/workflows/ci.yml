name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: python3 scripts/check_versions.py
      - run: npm run test
      - run: npm run build
      - name: Prepare sidecar placeholder for Tauri metadata check
        run: |
          touch src-tauri/binaries/sbk-scanner-worker-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/sbk-scanner-worker-x86_64-unknown-linux-gnu
          mkdir -p src-tauri/runtime-resources/resources
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets --all-features
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml

  scanner-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install worker and test tools
        working-directory: scanner-worker
        run: pip install -r requirements-dev.lock
      - run: python -m pytest -q
        working-directory: scanner-worker
      - run: python -m ruff check .
        working-directory: scanner-worker
      - name: Exercise PDF, DOCX and facsimile through worker protocol
        run: |
          mkdir -p scanner-worker/tests/output
          python -m scandocument.worker_cli preview --config scanner-worker/tests/fixtures/preview.json
          python -m scandocument.worker_cli process --config scanner-worker/tests/fixtures/process.json
          python -m scandocument.worker_cli preview --config scanner-worker/tests/fixtures/preview-docx.json
          python -m scandocument.worker_cli process --config scanner-worker/tests/fixtures/process-docx.json
          python -m scandocument.worker_cli process --config scanner-worker/tests/fixtures/process-facsimile.json
