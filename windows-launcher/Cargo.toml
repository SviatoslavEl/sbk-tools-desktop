[package]
name = "sbk-tools-onefile-launcher"
version = "2.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
