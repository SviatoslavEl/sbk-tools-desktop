[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sbk-scanner-worker"
version = "2.5.1"
description = "Headless local document processing worker for SBK Tools"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-only" }
dependencies = [
  "numpy==2.2.6",
  "Pillow==11.2.1",
  "pypdf==5.6.0",
  "pypdfium2==5.13.0",
  "python-docx==1.2.0",
  "reportlab==4.4.1",
]

[project.scripts]
sbk-scanner-worker = "scandocument.worker_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
